name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Web app
        - Mobile app
        - API server
        - Local development setup
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser / device, OS, and whether this is the hosted site or a self-hosted instance.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
